<ion-header>
  <ion-toolbar>
    <ion-title>Calculadora de Promedio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="onSubmit()" #formRef="ngForm">
    <ion-item>
      <ion-label position="stacked">Nombre del Alumno</ion-label>
      <ion-input name="name" [(ngModel)]="name" required placeholder="Escribe tu nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 1</ion-label>
      <ion-input name="grade1" type="number" [(ngModel)]="grades[0]" required placeholder="Ej. 9.5"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 2</ion-label>
      <ion-input name="grade2" type="number" [(ngModel)]="grades[1]" required placeholder="Ej. 8.0"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 3</ion-label>
      <ion-input name="grade3" type="number" [(ngModel)]="grades[2]" required placeholder="Ej. 7.5"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 4</ion-label>
      <ion-input name="grade4" type="number" [(ngModel)]="grades[3]" required placeholder="Ej. 10.0"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 5</ion-label>
      <ion-input name="grade5" type="number" [(ngModel)]="grades[4]" required placeholder="Ej. 6.5"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Calificación 6</ion-label>
      <ion-input name="grade6" type="number" [(ngModel)]="grades[5]" required placeholder="Ej. 9.0"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" [disabled]="!canSubmit()">Calcular Promedio</ion-button>
  </form>



  <div *ngIf="averageResult !== null" class="result-card">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Resultado del Promedio</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>
          <strong>{{ name || 'Usuario' }}</strong>, tu promedio general es de: <strong>{{ averageResult | number: '1.2-2' }}</strong>.
        </p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
